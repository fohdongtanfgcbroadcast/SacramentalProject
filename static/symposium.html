<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symposium — 향연</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>

<header class="symposium-header">
  <a href="/" class="back-link">← 홈</a>
  <h1>향연</h1>
</header>

<main class="symposium-layout">
  <!-- 좌측: 신학자 선택 패널 -->
  <aside id="panel" class="theologian-panel">
    <h3>신학자 초대 <span id="selectedCount">(0/5)</span></h3>
    <div id="theologianList" class="theologian-checklist"></div>
    <button id="btnStart" class="btn btn-primary" disabled>향연 시작</button>
  </aside>

  <!-- 중앙: 대화 영역 -->
  <section class="chat-area">
    <!-- 신앙고백서 컨텍스트 -->
    <div id="confessionContext" class="confession-context hidden"></div>

    <div id="chatMessages" class="chat-messages">
      <div class="chat-welcome">
        <p>신학자를 최대 5명 선택하고 향연을 시작하세요.</p>
      </div>
    </div>

    <!-- 추천 질문 -->
    <div id="recommendations" class="recommendations hidden"></div>

    <!-- 발언자 선택 (좌장 모드) -->
    <div id="speakerPicker" class="speaker-picker hidden">
      <span class="picker-label" id="pickerLabel">누가 먼저 답할까요?</span>
      <div id="pickerButtons" class="picker-buttons"></div>
    </div>

    <!-- 입력 -->
    <form id="chatForm" class="chat-input-form hidden">
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="질문을 입력하세요..." required>
        <button type="submit" class="btn btn-primary">보내기</button>
      </div>
    </form>
  </section>
</main>

<script src="/static/symposium.js?v=3"></script>
</body>
</html>
