[project]
name = "symposium"
version = "0.9.0"
description = "Symposium — 신학 문헌 RAG 플랫폼. 몰트만으로 시작하는 교부·현대 신학자 질의응답 시스템"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.111.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
]

[project.scripts]
symposium = "symposium.cli:app"
symposium-serve = "symposium.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symposium"]
